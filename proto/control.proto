// proto2 for protobuf 2.6.1 compatibility in core (see handshake.proto).
syntax = "proto2";
package forever_module;

// Dynamic bot-ownership control messages. See doc/module-system/04-phase2-module-host-design.md §6.

message SpawnParams {
  // Deferred in doc/module-system/04 §Deferred: race/class/level/team fields TBD once bot-spawning
  // requirements are nailed down in the Phase 5 reference module work. Placeholder fields below.
  optional uint32 race = 1;
  optional uint32 class_id = 2;
  optional uint32 level = 3;
  optional uint32 team = 4;
  // Placement: with place true, the bot is put at (map_id, pos_x, pos_y, pos_z) when it logs in, instead of being spread around
  // its race's start. For repeatable scenarios (doc 19). map_id 0 is a real map, hence the explicit flag.
  optional bool place = 5;
  optional uint32 map_id = 6;
  optional float pos_x = 7;
  optional float pos_y = 8;
  optional float pos_z = 9;
  // An alt: with alt_name set, no character is created; the character with this name, on the account of the player owner_guid (a character
  // guid counter, who must be online), logs in as a bot. Needs Bot.Alt.Enabled in the core. race and class_id are ignored.
  optional string alt_name = 10;
  optional uint64 owner_guid = 11;
}

message ControlRequest {
  optional uint64 bot_guid = 1;          // 0 = "please spawn a new bot and give me control"
  optional SpawnParams spawn_params = 2; // only used when bot_guid == 0
}

message ControlResponse {
  optional bool granted = 1;
  optional uint64 bot_guid = 2;          // assigned guid if newly spawned
  optional uint32 race = 4;              // of the bot, when granted (newly spawned or alt)
  optional uint32 class_id = 5;
  optional string reason = 3;            // populated when granted == false, e.g. "already controlled by module X",
                                         // "character not found" (stale bot_alt entry, see doc/module-system/10 §2)
}

message ReleaseControl {
  optional uint64 bot_guid = 1;
}

// core -> module notify: bot is no longer controllable (deleted, logged out, GM revoked).
message ControlRevoked {
  optional uint64 bot_guid = 1;
  optional string reason = 2;
}
