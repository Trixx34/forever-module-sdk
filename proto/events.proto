syntax = "proto2";
package forever_module;

// Tier 1 event payloads for the v1 hook subset only (doc/module-system/03-phase1-protocol-design.md,
// "Initial hook subset (v1)"): PlayerScript::OnLogin/OnLogout, AccountScript::OnAccountLogin,
// WorldScript::OnStartup/OnShutdown, CommandScript, PlayerScript::OnLootItem. Damage/heal/aura/level/quest hooks are
// deliberately absent and are added only after the Phase 3 end-to-end walkthrough (doc 03).
// See doc/module-system/08-forever-bot-migration-gap-analysis.md for the full hook mapping.

message PlayerLoginEvent {
  optional uint64 player_guid = 1;
}

message PlayerLogoutEvent {
  optional uint64 player_guid = 1;
}

// PlayerScript::OnLootItem, sent after an item from a loot window was stored in the player's bags.
// sell_price is per item, in copper, from the item template (0 if the item cannot be sold).
message PlayerItemLootedEvent {
  optional uint64 player_guid = 1;
  optional uint64 item_guid = 2;
  optional uint32 item_entry = 3;
  optional uint32 count = 4;
  optional uint32 quality = 5;
  optional uint32 item_class = 6;
  optional uint32 sell_price = 7;
  optional string item_name = 8;  // default-locale name, for player-facing messages
}

message WorldStartupEvent {
}

message WorldShutdownEvent {
}

message AccountLoginEvent {
  optional uint32 account_id = 1;
}

// Fire-and-forget event dispatch (core -> module). Core never blocks on these.
message EventNotify {
  optional string hook_name = 1;
  oneof event_payload {
    PlayerLoginEvent player_login = 10;
    PlayerLogoutEvent player_logout = 11;
    WorldStartupEvent world_startup = 12;
    WorldShutdownEvent world_shutdown = 13;
    AccountLoginEvent account_login = 14;
    PlayerItemLootedEvent player_item_looted = 15;
  }
}

// Request/reply hooks where core needs a result back (e.g. chat commands).
// Core blocks on these with a bounded timeout (default 200ms, see doc/module-system/03 "Notify vs. Request/Reply split").
message CommandRequestPayload {
  optional string command_text = 1;
  optional uint64 issuer_guid = 2;
}

message CommandReplyPayload {
  optional bool success = 1;
  optional string result_text = 2;
}

message EventRequest {
  optional uint64 message_id = 1; // correlates with the EventReply carrying the same id
  optional string hook_name = 2;
  oneof request_payload {
    CommandRequestPayload command = 10;
  }
}

message EventReply {
  optional uint64 message_id = 1;
  oneof reply_payload {
    CommandReplyPayload command = 10;
  }
}
