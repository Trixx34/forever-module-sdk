// proto2 for protobuf 2.6.1 compatibility in core (see handshake.proto).
syntax = "proto2";
package forever_module;

import "events.proto";

// Module -> core requests that core carries out on the world thread (doc/module-system: Actions).
// Core never blocks the module on these: the request is queued, executed on a later world tick, and
// answered with an ActionReply carrying the same message id. Core re-checks everything it is asked
// to act on (player online, item still present with the same entry and count); the module's view
// of the world can be stale by the time the action runs.

// Sells one whole stack of an item the player is carrying. Core pays the item's sell price from its
// own item template; the module never sets an amount.
message SellItemAction {
  optional uint64 player_guid = 1;
  optional uint64 item_guid = 2;
  optional uint32 item_entry = 3;  // must match the item found under item_guid
  optional uint32 count = 4;       // must equal the item's current stack size
}

// Gives a copy of a quest item the player just looted to each of the player's party members who still need it. Core finds the
// party, keeps the members on the player's map and within range_yards (0 = the default), checks that each has a quest that needs
// the item and room in the bags, and gives count of the item. The player keeps their own copy.
message ShareQuestItemAction {
  optional uint64 player_guid = 1;  // the member who looted the item
  optional uint32 item_entry = 2;
  optional uint32 count = 3;
  optional uint32 range_yards = 4;
}

// Buys count of item_entry from a vendor NPC. Core checks the vendor is in interaction range,
// the item is on the vendor's sell list, and the player has enough money.
message BuyItemAction {
  optional uint64 vendor_guid = 1;
  optional uint32 item_entry = 2;
  optional uint32 count = 3;
  optional uint64 player_guid = 4; // raw character GUID counter from BotSnapshot.guid; required for a module purchase
}

// Auction house interaction at an auctioneer NPC. Core re-checks the auction still exists and the
// player has the money/item at execution time; the module's view can be stale.
message AuctionHouseAction {
  enum AHOp {
    kBrowse = 0;   // scan the AH for item_entry (results delivered via a PlayerScript.OnAuctionResult notify), or by filter (see inventory_type)
    kBid = 1;      // bid on auction_guid, offering bid copper
    kBuyout = 2;   // buy out auction_guid at buyout copper
    kList = 3;     // list item_guid (from bags) as a stack of count at bid/buyout copper
    kCancel = 4;   // cancel auction_guid, returning the item to the player's bags
  }
  optional AHOp op = 1;
  optional uint64 auctioneer_guid = 2;  // the auctioneer NPC
  optional uint64 item_guid = 3;        // for kList: the item in the player's bags
  optional uint64 auction_guid = 4;     // for kBid/kBuyout/kCancel: the AH auction
  optional uint32 item_entry = 5;       // for kBrowse: what to search for
  optional uint32 count = 6;            // for kList: stack size
  optional uint32 bid = 7;              // copper, for kBid/kList
  optional uint32 buyout = 8;           // copper, for kList
  optional uint64 player_guid = 9;      // raw character GUID counter from BotSnapshot.guid; required for actions using its money/items
  // kBrowse by filter (protocol 19). Used when item_entry is 0 and inventory_type is not 0: the core looks through the whole house for the
  // bot in player_guid and answers with the matching listings in ActionReply.listings (no PlayerScript.OnAuctionResult events, so the
  // module needs no hook), cheapest buyout first. Only listings with a buyout, not the bot's own, and not a stack are considered. With
  // item_entry set the browse is the old one (events, one item entry) and these fields are ignored.
  optional uint32 inventory_type = 10;  // InventoryType (1 head ... 26 ranged right); 0 = no filter (then item_entry is needed)
  optional uint32 min_level = 11;       // required level of the item, from; 0 = no lower bound
  optional uint32 max_level = 12;       // ... up to; 0 = no upper bound
  optional uint32 max_results = 13;     // at most this many listings; 0 = the core's default (10), capped at 50
  optional uint32 max_buyout = 14;      // copper: no listing dearer than this; 0 = no bound
  optional bool only_upgrades = 15;     // only listings whose upgrade_score is above 0 for this bot
}

// Writes one line to the core's server log (Server.log), tagged with the module's name. level 0 is info, 1 warning, 2 error; text is
// 1 to 255 bytes. Needs no player. For lines the operator should find next to the core's own, such as a periodic summary.
message LogAction {
  optional uint32 level = 1;
  optional string text = 2;
}

// Sends a system message to a player, the same way a GM command reply is shown.
message SendPlayerMessageAction {
  optional uint64 player_guid = 1;
  optional string text = 2;
}

// A bot speaks. kind 0 is /say (everyone nearby hears it), kind 1 is a whisper to player_guid. The core sends it as the bot's own chat line;
// text is 1 to 255 bytes. Used for short acknowledgements of a command and for a bot's trade whispers.
message BotSpeakAction {
  optional uint64 bot_guid = 1;     // raw character GUID counter from BotSnapshot.guid
  optional uint32 kind = 2;         // 0 say, 1 whisper
  optional uint64 player_guid = 3;  // whisper only: raw character GUID counter of the player to whisper
  optional string text = 4;
}

// One item a bot could put in a trade. item_guid is what BotTradeAction kSetItem takes.
message TradeBagItem {
  optional uint64 item_guid = 1;
  optional uint32 entry = 2;
  optional uint32 count = 3;
  optional string name = 4;         // the item's name in the core's default locale
}

// The trade window of a bot. Core runs these through the same code a real player's trade uses (so a cancel or a disconnect returns
// the items), and re-checks everything when the action runs: the trade is still open, the item is still in the bags and can be traded.
message BotTradeAction {
  enum TradeOp {
    kBegin = 0;       // accept the trade a player asked for: the window opens
    kSetItem = 1;     // put item_guid in trade slot `slot` (0 to 5)
    kClearItem = 2;   // take the item out of trade slot `slot`
    kSetGold = 3;     // offer `copper`
    kAccept = 4;      // press the Trade button (the trade completes when both sides have)
    kCancel = 5;      // close the window
    kListBags = 6;    // reply carries bag_items: the bot's items that can be traded now
  }
  optional TradeOp op = 1;
  optional uint64 bot_guid = 2;     // raw character GUID counter from BotSnapshot.guid
  optional uint32 slot = 3;
  optional uint64 item_guid = 4;
  optional uint64 copper = 5;
}

// Tells the core which role (and, since protocol 18, which spec) a bot plays, so the bot spends its talent points by the profile for its
// (class, spec) or else its (class, role) (core setting Bot.Talents.Profiles). The core knows the bot's class; the module owns the role
// (BotState::Role_, or what Auto gives the class) and the spec.
// Send it when the bot first appears, when its role changes and after each level-up; the core spends what the level allows, out of combat,
// and replies success false with a reason when it could not (in combat, below level 10), so the module asks again later. A bot with no
// profile for its (class, spec) or (class, role) gets the core's greedy allocator. Points already spent are not taken back (no respec yet).
message SpendBotTalentsAction {
  optional uint64 bot_guid = 1;  // raw character GUID counter from BotSnapshot.guid
  optional uint32 role = 2;      // 0 none, 1 tank, 2 healer, 3 dps
  optional uint32 spec = 3;      // 0 none, else a TalentSpec (include/forever_module/talent_spec.h: 1 to 28); it must belong to the bot's class
}

// Module store (doc 15): rows private to the requesting module, in the world database. The core takes the
// module from the session, so a request can only reach that module's own rows.
message StoreGetAction {
  optional string key = 1;
}

message StoreSetAction {
  optional string key = 1;
  optional bytes value = 2;
}

message StoreDeleteAction {
  optional string key = 1;
}

message StoreListAction {
  optional string prefix = 1;        // keys starting with this; empty lists all
}

message ActionRequest {
  optional uint64 message_id = 1; // correlates with the ActionReply carrying the same id
  oneof action_payload {
    SellItemAction sell_item = 10;
    SendPlayerMessageAction send_message = 11;
    StoreGetAction store_get = 12;
    StoreSetAction store_set = 13;
    StoreDeleteAction store_delete = 14;
    StoreListAction store_list = 15;
    ShareQuestItemAction share_quest_item = 16;
    LogAction log = 17;
    BuyItemAction buy_item = 18;
    AuctionHouseAction auction_house = 19;
    BotSpeakAction bot_speak = 20;
    BotTradeAction bot_trade = 21;
    SpendBotTalentsAction spend_bot_talents = 22;
  }
}

message ActionReply {
  optional uint64 message_id = 1;
  optional bool success = 2;
  optional string reason = 3;        // filled when success is false; for logs, not shown to players
  optional uint64 copper_gained = 4; // SellItem only: money credited to the player
  optional bool found = 5;           // StoreGet: whether the key exists; StoreDelete: whether it existed
  optional bytes value = 6;          // StoreGet: the stored value when found
  repeated string keys = 7;          // StoreList: the matching keys, sorted
  optional uint32 recipients = 8;    // ShareQuestItem: how many party members were given the item
  optional uint64 copper_spent = 9;  // BuyItem only: money taken from the player
  optional uint32 item_entry = 10;   // AuctionHouse kList: the entry of the auction created, to correlate with results
  optional uint64 auction_guid = 11; // AuctionHouse kList: the guid of the auction core created
  repeated TradeBagItem bag_items = 12; // BotTrade kListBags: the items the bot can trade now
  repeated AuctionListingEvent listings = 13; // AuctionHouse kBrowse by filter (protocol 19): the matching listings, cheapest buyout first
}
